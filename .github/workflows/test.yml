name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: vitest
        run: npm test

      - name: the refactor is still faithful to the original
        run: node scripts/verify-faithful.mjs --ticks 20000 --seeds 1,12,4242
